# OpenMPTCProuter - USB Modem Module Parameters
# Optimized for high-speed 4G/5G modems with WAN bonding

# QMI WWAN driver - increase buffer sizes for 5G throughput
# Default rx_urb_size is often too small for modern modems
options qmi_wwan rx_urb_size=32768

# USB WWAN driver - similar buffer optimization
options usb_wwan rx_urb_size=32768

# CDC NCM driver - optimize for high bandwidth
# min_tx_pkt: minimum TX packet aggregation (higher = better throughput, worse latency)
# tx_max: maximum TX aggregation size
options cdc_ncm min_tx_pkt=4 tx_max=32768

# CDC MBIM driver - optimize for modern modems
# MTU handled automatically by protocol
options cdc_mbim tx_max=32768

# Note: These parameters are applied when the modules are loaded.
# To apply changes without reboot: rmmod <module> && modprobe <module>
# WARNING: This will temporarily disconnect any modems using that driver.
